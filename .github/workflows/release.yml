name: package-palace-omp

# 별도 배포 채널을 연결하기 전에는 기존 Palace 릴리즈를 덮어쓰지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: palace-omp-mac
          path: |
            dist/*.dmg
            dist/*.zip
